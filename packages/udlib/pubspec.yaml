name: udlib
description: >-
  Shared Flutter code for the Unexpected Developments apps: changelog,
  error log, locale handling, preference stores, text search and an
  external-link tile with share/QR actions.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Deliberately minimal. This package is consumed by coldsleep, which
  # has no maps and no location, so anything with a native side stays
  # out of here -- see udlib_riverpod for geolocator.
  shared_preferences: ^2.5.5
  intl: ^0.20.2

  # ExternalLinkTile's three: url_launcher and qr_flutter have no
  # native surface worth mentioning (a link opener, a Dart-only QR
  # painter). share_plus DOES have one -- an exception to the "no
  # native side" rule above, judged acceptable because the platform
  # code involved is minimal (no permissions, no background service,
  # just invoking the OS share sheet), unlike geolocator's continuous
  # location tracking, which is why THAT stayed out and went to
  # udlib_riverpod instead.
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  # >=13.0.0, not the ^11.1.0 that resolves standalone: sanlo/pilares
  # also depend on geolocator, whose win32 ^6.0.0 (via
  # package_info_plus) conflicts with share_plus <13's win32 ^5.5.3.
  # Pinned here, not left to each app to discover, so this package
  # resolves the same way everywhere it is used.
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
