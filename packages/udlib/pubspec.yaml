name: udlib
description: >-
  Shared Flutter code for the Unexpected Developments apps: changelog,
  error log, locale handling, preference stores and text search.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Deliberately minimal. This package is consumed by coldsleep, which
  # has no maps and no location, so anything with a native side stays
  # out of here -- see udlib_riverpod for geolocator.
  shared_preferences: ^2.5.5
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
